<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NIKE</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <button class="hamburger mobile-only" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <a href="index.html" class="header__logo">Nike</a>
    <div class="header__actions">
      <a href="checkout.html" class="header__cart">
        🛒
        <span class="header__cart-count" style="display:none">0</span>
      </a>
    </div>
  </header>

  <!-- Nav Drawer -->
  <div class="nav-overlay"></div>
  <nav class="nav-drawer">
    <button class="nav-drawer__close">✕</button>
    <div class="nav-drawer__links">
      <a href="index.html">Inicio</a>
      <a href="search.html?cat=hombre">Hombre</a>
      <a href="search.html?cat=mujer">Mujer</a>
      <a href="search.html">Todos los productos</a>
      <a href="checkout.html">Carrito</a>
    </div>
  </nav>

  <!-- Checkout -->
  <div class="checkout">
    <h1 class="checkout__title">Tu pedido</h1>

    <div class="checkout__items" id="checkout-items">
      <!-- Rendered by JS -->
    </div>

    <div class="checkout__summary" id="checkout-summary" style="display:none">
      <!-- Rendered by JS -->
    </div>

    <div class="shipping-form">
      <h2 class="shipping-form__title">Envío</h2>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" placeholder="Nombre y apellidos">
      </div>
      <div class="form-group">
        <label for="address">Dirección</label>
        <input type="text" id="address" placeholder="Calle, número, piso">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="city">Ciudad</label>
          <input type="text" id="city" placeholder="Madrid">
        </div>
        <div class="form-group">
          <label for="zip">Código postal</label>
          <input type="text" id="zip" placeholder="28001">
        </div>
      </div>
      <div class="form-group">
        <label for="province">Provincia</label>
        <select id="province">
          <option value="">Seleccionar</option>
          <option>Madrid</option>
          <option>Barcelona</option>
          <option>Valencia</option>
          <option>Sevilla</option>
          <option>Bilbao</option>
          <option>Otra</option>
        </select>
      </div>
    </div>

    <button class="pay-btn" onclick="sendToWhatsApp()">Finalizar compra</button>
    <div class="secure-note">🔒 Envios 100% seguro</div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__grid">
      <div>
        <div class="footer__col-title">Ayuda</div>
        <div class="footer__links">
          <a href="#">Atención al cliente</a>
          <a href="#">Envío</a>
          <a href="#">Devoluciones</a>
        </div>
      </div>
      
    </div>
    <div class="footer__bottom">
      © 2026 Nike Clone — Proyecto de ventas
    </div>
  </footer>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
