<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar | NIKE</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <button class="hamburger mobile-only" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <a href="index.html" class="header__logo">Nike</a>
    <div class="header__actions">
      <a href="checkout.html" class="header__cart">
        🛒
        <span class="header__cart-count" style="display:none">0</span>
      </a>
    </div>
  </header>

  <!-- Nav Drawer -->
  <div class="nav-overlay"></div>
  <nav class="nav-drawer">
    <button class="nav-drawer__close">✕</button>
    <div class="nav-drawer__links">
      <a href="index.html">Inicio</a>
      <a href="search.html?cat=hombre">Hombre</a>
      <a href="search.html?cat=mujer">Mujer</a>
      <a href="search.html">Todos los productos</a>
      <a href="checkout.html">Carrito</a>
    </div>
  </nav>

  <!-- Search Bar -->
  <div class="search-bar">
    <input type="text" id="search-input" class="search-bar__input" placeholder="Buscar productos...">
  </div>

  <!-- Filter Toggle (mobile) -->
  <div class="filter-toggle">
    <span class="results-count">12 resultados</span>
    <button class="filter-toggle__btn">
      Filtros
      <span class="filter-toggle__count">0</span>
    </button>
  </div>

  <!-- Filter Drawer -->
  <div class="filter-overlay"></div>
  <div class="filter-drawer">
    <div class="filter-drawer__handle"></div>
    <div class="filter-drawer__title">
      Filtros
      <button class="filter-drawer__close">✕</button>
    </div>

    <div class="filter-group">
      <div class="filter-group__label">Categoría</div>
      <div class="filter-group__options">
        <button class="filter-chip" data-value="Hombre">Hombre</button>
        <button class="filter-chip" data-value="Mujer">Mujer</button>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-group__label">Tipo</div>
      <div class="filter-group__options">
        <button class="filter-chip" data-value="Zapatillas">Zapatillas</button>
        <button class="filter-chip" data-value="Running">Running</button>
        <button class="filter-chip" data-value="Training">Training</button>
        <button class="filter-chip" data-value="Casual">Casual</button>
      </div>
    </div>

    <button class="filter-apply" onclick="document.querySelector('.filter-drawer__close').click()">Aplicar filtros</button>
  </div>

  <!-- Product Grid -->
  <section class="section">
    <div class="product-grid" id="product-grid"></div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__grid">
      <div>
        <div class="footer__col-title">Ayuda</div>
        <div class="footer__links">
          <a href="#">Atención al cliente</a>
          <a href="#">Envío</a>
          <a href="#">Devoluciones</a>
        </div>
      </div>
      <div>
        <div class="footer__col-title">Sobre Nike</div>
        <div class="footer__links">
          <a href="#">Noticias</a>
          <a href="#">Empleo</a>
          <a href="#">Sostenibilidad</a>
        </div>
      </div>
    </div>
    <div class="footer__bottom">
      © 2026 Nike Clone — Proyecto de aprendizaje
    </div>
  </footer>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
